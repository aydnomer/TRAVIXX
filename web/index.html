<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#1a2744">

  <!-- SEO -->
  <title>Travixx — Türkiye'yi Akıllıca Keşfet</title>
  <meta name="description" content="Türkiye'nin 81 ilindeki tarihi mekanları, müzeleri ve gezilecek yerleri QR kod, GPS ve 6 dil desteği ile keşfedin. Yapay zeka destekli akıllı turizm rehberi.">
  <meta name="keywords" content="travixx, türkiye turizm, gezilecek yerler, qr rehber, turistik mekanlar, 81 il, tarihi yerler, kapadokya, istanbul, gezi rehberi">
  <meta name="author" content="Ömer Faruk Aydın">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn link önizleme) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Travixx — Türkiye'yi Akıllıca Keşfet">
  <meta property="og:description" content="81 şehir, 2.400+ tarihi mekan. QR destekli rehberlik ve yapay zeka ile kişisel gezi deneyimi.">
  <meta property="og:image" content="https://aydnomer.github.io/TRAVIXX/icons/Icon-512.png">
  <meta property="og:url" content="https://aydnomer.github.io/TRAVIXX/">
  <meta property="og:site_name" content="Travixx">
  <meta property="og:locale" content="tr_TR">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Travixx — Türkiye'yi Akıllıca Keşfet">
  <meta name="twitter:description" content="81 şehir, 2.400+ tarihi mekan. QR destekli akıllı turizm rehberi.">
  <meta name="twitter:image" content="https://aydnomer.github.io/TRAVIXX/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Travixx">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Yükleme sırasında flash önleme stili -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #travixx-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a2744 0%, #2d3e5e 100%);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #travixx-loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-logo {
      width: 64px;
      height: 64px;
      background: #f97316;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
    }
    .loader-title {
      margin-top: 16px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .loader-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #cbd5e9;
    }
    .loader-spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Flutter yüklenirken gösterilecek profesyonel yükleyici -->
  <div id="travixx-loader">
    <div class="loader-logo">✈</div>
    <div class="loader-title">Travixx</div>
    <div class="loader-subtitle">Türkiye'yi Keşfet</div>
    <div class="loader-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter motoru başladığında yükleyiciyi gizle
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('travixx-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      }
    });
  </script>
</body>
</html>
