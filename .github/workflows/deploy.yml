name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Flutter SDK kurulumu (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter ortam kontrolü
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Statik analiz (continue on error)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      - name: Web release build
        run: flutter build web --release --base-href "/TRAVIXX/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Pages artifact yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e deploy
        id: deployment
        uses: actions/deploy-pages@v4
