name: Keep Supabase awake

# Supabase ücretsiz planı 7 gün boyunca hiç istek almayan projeyi duraklatır.
# Bu iş akışı her gün veritabanına küçük bir okuma isteği atar, böylece
# proje kullanılmasa bile uykuya geçmez. Herkese açık anon anahtarı kullanır
# (uygulamanın içindekiyle aynı); gizli bir anahtar gerekmez.

on:
  schedule:
    - cron: "17 6 * * *" # her gün 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lib/core/constants/supabase_constants.dart
          sparse-checkout-cone-mode: false

      - name: Supabase'e istek at
        run: |
          f=lib/core/constants/supabase_constants.dart
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" "$f" | head -1)
          key=$(grep -o "eyJ[A-Za-z0-9._-]*" "$f" | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$url/rest/v1/cities?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "HTTP $code"
          # Proje zaten duraklatıldıysa istek ulaşmaz; panelden "Restore" gerekir.
          [ "$code" = "200" ]
